name: appconomy
description: Appconomy was a mobile-commerce platform company, founded in 2010 and dual-headquartered
  in Austin, Texas and Shanghai, China, that let brands, retailers, service providers, and mobile
  carriers add commerce functionality (daily deals, coupons, loyalty and rewards, mobile gifting, and
  merchant app generation for marketplaces such as Taobao) to their mobile apps. It was venture-backed
  with strategic investors including Qiming Venture Partners (lead of a $10M Series A), True Ventures,
  Neusoft Holdings, and WTI. The company is now permanently closed and publishes no live developer
  surface. The appconomy.cn domain does not resolve, appconomy.com returns 404, and no public API,
  documentation, developer portal, SDK, or /.well-known/ endpoint could be found. This profile is
  retained as a historical portfolio-graph record rather than an active API provider.
